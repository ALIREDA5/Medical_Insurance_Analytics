// STATE
// ============================================================
let currentTable = null;
let editMode     = false;
let editId       = null;
let searchCache  = [];
const fkCache    = {};

// ============================================================
// INIT  — event delegation fixes sidebar click in Apps Script
// ============================================================
document.addEventListener('DOMContentLoaded', () => {

  document.getElementById('sidebarNav').addEventListener('click', e => {
    const link = e.target.closest('[data-table]');
    if (!link) return;
    e.preventDefault();
    showTable(link.dataset.table);
  });

  google.script.run
    .withSuccessHandler(user => {
      if (!user) {
        document.body.innerHTML =
          '<div style="padding:2rem;text-align:center"><h3>Access Denied</h3></div>';
        return;
      }
      document.getElementById('userEmail').textContent = user.email;
      const allowed = user.tables === '*'
        ? null
        : user.tables.split(',').map(t => t.trim());
      renderSidebar(allowed);
    })
    .withFailureHandler(() => renderSidebar(null))
    .getCurrentUser();
});

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar(allowed) {
  document.getElementById('sidebarNav').innerHTML = MODULES.map(mod => {
    const visible = mod.tables.filter(t => TABLES[t] && (!allowed || allowed.includes(t)));
    if (!visible.length) return '';
    return `
      <div class="sidebar-module">
        <i class="fas ${mod.icon} me-1"></i>${mod.label}
      </div>
      ${visible.map(t => `
        <a href="#" class="sidebar-link" id="nav-${t}" data-table="${t}">
          ${TABLES[t].label}
        </a>`).join('')}`;
  }).join('');
}

// ============================================================
// SHOW TABLE
// ============================================================
function showTable(name) {
  if (!TABLES[name]) return;
  currentTable = name; editMode = false; editId = null; searchCache = [];

  document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + name);
  if (navEl) navEl.classList.add('active');

  const cfg = TABLES[name];
  document.getElementById('mainContent').innerHTML = `
    <div class="d-flex align-items-center mb-3">
      <h5 class="mb-0 fw-bold text-navy">
        <i class="fas fa-table me-2"></i>${cfg.label}
      </h5>
    </div>
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <a class="nav-link active" id="tab-form" href="#"
          onclick="switchTab('form');return false;">
          <i class="fas fa-plus-circle me-1"></i>Add New
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-search" href="#"
          onclick="switchTab('search');return false;">
          <i class="fas fa-search me-1"></i>Search & Edit
        </a>
      </li>
    </ul>
    <div id="panel-form">${buildFormHTML(cfg)}</div>
    <div id="panel-search" style="display:none">${buildSearchHTML(cfg)}</div>
  `;
  loadFkDropdowns(cfg.fields);
}

function switchTab(tab) {
  document.getElementById('panel-form').style.display   = tab === 'form'   ? '' : 'none';
  document.getElementById('panel-search').style.display = tab === 'search' ? '' : 'none';
  document.getElementById('tab-form').classList.toggle('active',   tab === 'form');
  document.getElementById('tab-search').classList.toggle('active', tab === 'search');
}

// ============================================================
// FORM BUILDER
// ============================================================
function buildFormHTML(cfg) {
  const pairs = [];
  for (let i = 0; i < cfg.fields.length; i += 2) {
    const a = buildFieldHTML(cfg.fields[i]);
    const b = cfg.fields[i+1] ? buildFieldHTML(cfg.fields[i+1]) : '';
    pairs.push(`<div class="row g-3">
      <div class="col-md-6">${a}</div>
      <div class="col-md-6">${b}</div>
    </div>`);
  }
  const subHTML = (cfg.isMerged && cfg.subSections)
    ? cfg.subSections.map(s => buildSubSectionHTML(s)).join('') : '';

  return `
    <div class="card">
      <div class="card-header">
        <span id="formTitle">
          <i class="fas fa-plus-circle me-2"></i>New ${cfg.label} Record
        </span>
      </div>
      <div class="card-body">
        <form id="dataForm" onsubmit="submitForm(event)" novalidate>
          <div class="section-title mb-2">
            <i class="fas fa-info-circle me-2"></i>Main Information
          </div>
          ${pairs.join('<hr class="my-2">')}
          ${subHTML}
          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <i class="fas fa-save me-2"></i>Save Record
            </button>
            <button type="button" class="btn btn-outline-secondary" onclick="resetForm()">
              <i class="fas fa-undo me-2"></i>Reset
            </button>
          </div>
        </form>
      </div>
    </div>`;
}

function buildSubSectionHTML(section) {
  if (section.type === 'static') {
    const pairs = [];
    for (let i = 0; i < section.fields.length; i += 2) {
      const a = buildFieldHTML(section.fields[i]);
      const b = section.fields[i+1] ? buildFieldHTML(section.fields[i+1]) : '';
      pairs.push(`<div class="row g-3">
        <div class="col-md-6">${a}</div>
        <div class="col-md-6">${b}</div>
      </div>`);
    }
    return `<hr class="my-3">
      <div class="subsection-header">
        <span class="section-title">
          <i class="fas ${section.icon||'fa-layer-group'} me-2"></i>${section.title}
        </span>
      </div>
      ${pairs.join('<hr class="my-2">')}`;
  }
  if (section.type === 'repeatable') {
    const ths = section.itemFields.map(f => `<th>${f.label}</th>`).join('') + '<th></th>';
    return `<hr class="my-3">
      <div class="subsection-header d-flex justify-content-between align-items-center">
        <span class="section-title">
          <i class="fas ${section.icon||'fa-list'} me-2"></i>${section.title}
        </span>
        <button type="button" class="btn btn-sm btn-outline-primary"
          onclick="addItemRow('${section.id}')">
          <i class="fas fa-plus me-1"></i>Add Row
        </button>
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-bordered mb-1">
          <thead><tr>${ths}</tr></thead>
          <tbody id="${section.id}-tbody"></tbody>
        </table>
      </div>
      <div class="form-text">Click "Add Row" to add items.</div>`;
  }
  return '';
}

function buildFieldHTML(f) {
  const req  = f.required ? '<span class="required-star">*</span>' : '';
  const hint = f.hint ? `<div class="form-text">${f.hint}</div>` : '';
  let ctrl   = '';

  if (f.autoGen) {
    ctrl = `<input type="text" class="form-control" id="f-${f.name}" placeholder="Auto-generated" disabled>`;
  } else if (f.readonly) {
    ctrl = `<input type="text" class="form-control" id="f-${f.name}" value="${f.defaultValue||''}" readonly>`;
  } else if (f.type === 'select') {
    ctrl = `<select class="form-select" id="f-${f.name}" ${f.required?'required':''}>
      <option value="">-- Select --</option>
      ${f.options.map(o => `<option>${o}</option>`).join('')}
    </select>`;
  } else if (f.type === 'fk') {
    ctrl = `<select class="form-select" id="f-${f.name}" ${f.required?'required':''}>
      <option value="">-- Loading... --</option>
    </select>`;
  } else if (f.type === 'textarea') {
    ctrl = `<textarea class="form-control" id="f-${f.name}" rows="3"
      ${f.maxLength ? `maxlength="${f.maxLength}"` : ''}
      ${f.required  ? 'required' : ''}></textarea>`;
  } else {
    const attrs = [
      f.required   ? 'required'              : '',
      f.pattern    ? `pattern="${f.pattern}"` : '',
      f.min !== undefined ? `min="${f.min}"` : '',
      f.max !== undefined ? `max="${f.max}"` : '',
      f.maxLength  ? `maxlength="${f.maxLength}"` : '',
      f.step       ? `step="${f.step}"`       : '',
    ].filter(Boolean).join(' ');
    ctrl = `<input type="${f.type}" class="form-control" id="f-${f.name}" ${attrs}>`;
  }
  return `<div class="mb-1">
    <label class="form-label">${f.label}${req}</label>
    ${ctrl}${hint}
  </div>`;
}

// ============================================================
// SEARCH BUILDER
// ============================================================
function buildSearchHTML(cfg) {
  const inputs = cfg.searchFields.map(f => {
    const key  = f.filterKey || f.name;
    const ctrl = f.type === 'select'
      ? `<select class="form-select form-select-sm" id="sf-${key}">
          ${f.options.map(o => `<option value="${o}">${o||'-- All --'}</option>`).join('')}
         </select>`
      : `<input type="${f.type}" class="form-control form-control-sm"
          id="sf-${key}" placeholder="Search...">`;
    return `<div class="col-md-3">
      <label class="form-label">${f.label}</label>${ctrl}
    </div>`;
  }).join('');

  return `
    <div class="card mb-3">
      <div class="card-header"><i class="fas fa-filter me-2"></i>Search Filters</div>
      <div class="card-body">
        <form onsubmit="runSearch(event)">
          <div class="row g-3">${inputs}</div>
          <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-sm">
              <i class="fas fa-search me-1"></i>Search
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="clearSearch()">
              <i class="fas fa-times me-1"></i>Clear
            </button>
          </div>
        </form>
      </div>
    </div>
    <div id="searchResults"></div>`;
}

// ============================================================
// FK DROPDOWNS
// ============================================================
function loadFkDropdowns(fields, rowData) {
  const cfg = TABLES[currentTable];
  const allFk = [...fields.filter(f => f.type === 'fk')];
  if (cfg && cfg.isMerged && cfg.subSections) {
    cfg.subSections.forEach(s =>
      (s.fields || s.itemFields || []).filter(f => f.type === 'fk').forEach(f => allFk.push(f))
    );
  }
  [...new Set(allFk.map(f => f.fkFn))].forEach(fn => {
    const apply = opts => {
      fkCache[fn] = opts;
      const optHTML = `<option value="">-- Select --</option>` +
        opts.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
      fields.filter(f => f.fkFn === fn).forEach(f => {
        const sel = document.getElementById('f-' + f.name);
        if (!sel) return;
        sel.innerHTML = optHTML;
        if (rowData && rowData[f.name]) sel.value = rowData[f.name];
      });
      if (cfg && cfg.isMerged && cfg.subSections) {
        cfg.subSections.filter(s => s.type === 'static').forEach(s => {
          s.fields.filter(f => f.fkFn === fn).forEach(f => {
            const sel = document.getElementById('f-' + f.name);
            if (!sel) return;
            sel.innerHTML = optHTML;
            if (rowData && rowData[f.name]) sel.value = rowData[f.name];
          });
        });
      }
    };
    if (fkCache[fn]) { apply(fkCache[fn]); return; }
    google.script.run.withSuccessHandler(apply).withFailureHandler(console.error)[fn]();
  });
}

// ============================================================
// REPEATABLE ROW HELPERS
// ============================================================
function addItemRow(sectionId) {
  const cfg     = TABLES[currentTable];
  const section = cfg.subSections.find(s => s.id === sectionId);
  if (!section) return;
  const tbody = document.getElementById(sectionId + '-tbody');
  const cells = section.itemFields.map(f => {
    const attrs = [
      f.required ? 'required' : '',
      f.min !== undefined ? `min="${f.min}"` : '',
      f.step ? `step="${f.step}"` : '',
    ].filter(Boolean).join(' ');
    let ctrl = '';
    if (f.type === 'fk') {
      const opts = fkCache[f.fkFn] || [];
      ctrl = `<select class="form-select form-select-sm" data-field="${f.name}" ${f.required?'required':''}>
        <option value="">-- Select --</option>
        ${opts.map(o => `<option value="${o.value}">${o.label}</option>`).join('')}
      </select>`;
    } else if (f.type === 'select') {
      ctrl = `<select class="form-select form-select-sm" data-field="${f.name}" ${f.required?'required':''}>
        <option value="">-- Select --</option>
        ${f.options.map(o => `<option>${o}</option>`).join('')}
      </select>`;
    } else {
      ctrl = `<input type="${f.type}" class="form-control form-control-sm"
        data-field="${f.name}" placeholder="${f.label}" ${attrs}>`;
    }
    return `<td style="min-width:110px">${ctrl}</td>`;
  }).join('');
  const tr = document.createElement('tr');
  tr.innerHTML = cells +
    `<td><button type="button" class="btn btn-sm btn-outline-danger py-0"
      onclick="this.closest('tr').remove()">x</button></td>`;
  tbody.appendChild(tr);
}

function collectRepeatableItems(sectionId, itemFields) {
  const tbody = document.getElementById(sectionId + '-tbody');
  if (!tbody) return [];
  return Array.from(tbody.querySelectorAll('tr')).map(row => {
    const item = {};
    itemFields.forEach(f => {
      const el = row.querySelector(`[data-field="${f.name}"]`);
      if (el) item[f.name] = el.value;
    });
    return item;
  }).filter(item => itemFields.some(f => item[f.name]));
}

// ============================================================
// FORM SUBMIT
// ============================================================
function submitForm(e) {
  e.preventDefault();
  const cfg  = TABLES[currentTable];
  const data = {};

  cfg.fields.forEach(f => {
    if (f.autoGen) return;
    const el = document.getElementById('f-' + f.name);
    if (el) data[f.name] = el.value;
  });

  if (cfg.isMerged && cfg.subSections) {
    cfg.subSections.forEach(s => {
      if (s.type === 'static') {
        s.fields.forEach(f => {
          const el = document.getElementById('f-' + f.name);
          if (el) data[f.name] = el.value;
        });
      } else if (s.type === 'repeatable') {
        data[s.itemKey] = collectRepeatableItems(s.id, s.itemFields);
      }
    });
  }

  showSpinner();
  const onSuccess = r => {
    hideSpinner();
    if (r && r.success) {
      showToast('success', editMode ? 'Record updated.' : 'Saved! ID: ' + r.id);
      if (editMode) { editMode = false; editId = null; switchTab('search'); }
      else resetForm();
    } else {
      showToast('danger', (r && r.error) || 'An error occurred.');
    }
  };
  const onFailure = err => { hideSpinner(); showToast('danger', err.message || 'Server error'); };

  if (editMode) {
    google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure)
      [cfg.updateFn](editId, data);
  } else {
    google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure)
      [cfg.insertFn](data);
  }
}

function resetForm() {
  editMode = false; editId = null;
  document.getElementById('dataForm').reset();
  document.getElementById('formTitle').innerHTML =
    '<i class="fas fa-plus-circle me-2"></i>New ' + TABLES[currentTable].label + ' Record';
  document.getElementById('submitBtn').innerHTML =
    '<i class="fas fa-save me-2"></i>Save Record';

  TABLES[currentTable].fields.forEach(f => {
    if (f.defaultValue) {
      const el = document.getElementById('f-' + f.name);
      if (el) el.value = f.defaultValue;
    }
  });

  const cfg = TABLES[currentTable];
  if (cfg.isMerged && cfg.subSections) {
    cfg.subSections.filter(s => s.type === 'repeatable').forEach(s => {
      const tbody = document.getElementById(s.id + '-tbody');
      if (tbody) tbody.innerHTML = '';
    });
  }
}

// ============================================================
// SEARCH & EDIT
// ============================================================
function runSearch(e) {
  e.preventDefault();
  const cfg     = TABLES[currentTable];
  const filters = {};
  cfg.searchFields.forEach(f => {
    const key = f.filterKey || f.name;
    const el  = document.getElementById('sf-' + key);
    if (el && el.value) filters[key] = el.value;
  });
  showSpinner();
  google.script.run
    .withSuccessHandler(rows => { hideSpinner(); searchCache = rows; renderResults(rows, cfg); })
    .withFailureHandler(err  => { hideSpinner(); showToast('danger', err.message); })
    [cfg.searchFn](filters);
}

function clearSearch() {
  document.querySelectorAll('[id^="sf-"]').forEach(el => el.value = '');
  document.getElementById('searchResults').innerHTML = '';
}

function renderResults(rows, cfg) {
  const el = document.getElementById('searchResults');
  if (!rows || !rows.length) {
    el.innerHTML = '<div class="alert alert-info"><i class="fas fa-info-circle me-2"></i>No records found.</div>';
    return;
  }
  const cols  = cfg.displayCols;
  const thead = cols.map(c => '<th>' + c.replace(/_/g,' ') + '</th>').join('') + '<th></th>';
  const tbody = rows.map((row, idx) => {
    const cells = cols.map(c => '<td>' + (row[c] != null ? row[c] : '') + '</td>').join('');
    return '<tr>' + cells + '<td><button class="btn btn-sm btn-outline-primary py-0" onclick="editRow(' + idx + ')"><i class="fas fa-edit"></i></button></td></tr>';
  }).join('');

  el.innerHTML = `
    <div class="card">
      <div class="card-header d-flex justify-content-between">
        <span><i class="fas fa-list me-2"></i>Results</span>
        <span class="badge bg-secondary">${rows.length} record${rows.length!==1?'s':''}</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead><tr>${thead}</tr></thead>
            <tbody>${tbody}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

function editRow(idx) {
  const cfg = TABLES[currentTable];
  const row = searchCache[idx];
  editMode  = true;
  editId    = row[cfg.pkField];
  switchTab('form');

  document.getElementById('formTitle').innerHTML =
    '<i class="fas fa-edit me-2"></i>Edit ' + cfg.label +
    ' &mdash; <span class="badge-id">' + editId + '</span>';
  document.getElementById('submitBtn').innerHTML =
    '<i class="fas fa-sync-alt me-2"></i>Update Record';

  cfg.fields.forEach(f => {
    if (f.autoGen || f.type === 'fk') return;
    const el = document.getElementById('f-' + f.name);
    if (el && row[f.name] !== undefined) el.value = row[f.name];
  });
  loadFkDropdowns(cfg.fields, row);
}

// ============================================================
// UTILITIES
// ============================================================
function showSpinner() {
  if (document.getElementById('spinnerOverlay')) return;
  const d = document.createElement('div');
  d.id = 'spinnerOverlay'; d.className = 'spinner-overlay';
  d.innerHTML = '<div class="spinner-border text-primary" style="width:3rem;height:3rem"></div>';
  document.body.appendChild(d);
}

function hideSpinner() {
  const el = document.getElementById('spinnerOverlay');
  if (el) el.remove();
}

function showToast(type, msg) {
  const colors = { success:'#1a3a5c', danger:'#dc3545', info:'#0d6efd' };
  const t = document.getElementById('appToast');
  t.style.background = colors[type] || colors.info;
  document.getElementById('toastBody').textContent = msg;
  bootstrap.Toast.getOrCreateInstance(t, { delay:4000 }).show();
}
</script>
